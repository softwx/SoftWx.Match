name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore SoftWx.Match.sln

      - name: Build
        run: dotnet build SoftWx.Match.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SoftWx.Match.Test/SoftWx.Match.Test.csproj --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack SoftWx.Match/SoftWx.Match.csproj --configuration Release --no-build --output ./artifacts

      - name: Publish to NuGet
        if: ${{ secrets.NUGET_API_KEY != '' }}
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

