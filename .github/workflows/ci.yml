name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore SoftWx.Match.sln

      - name: Build
        run: dotnet build SoftWx.Match.sln --configuration Release --no-restore

      - name: Test (.NET 8 & .NET 10)
        run: dotnet test SoftWx.Match.Test/SoftWx.Match.Test.csproj --configuration Release --no-build --verbosity normal

      - name: Test (netstandard2.0 target)
        run: dotnet test SoftWx.Match.Test/SoftWx.Match.Test.csproj --configuration Release -f net8.0 -p:TestNetStandard=true --verbosity normal

      - name: Test (.NET 8, Debug)
        run: dotnet test SoftWx.Match.Test/SoftWx.Match.Test.csproj --configuration Debug -f net8.0 --verbosity normal

      - name: Test (netstandard2.0 target, Debug)
        run: dotnet test SoftWx.Match.Test/SoftWx.Match.Test.csproj --configuration Debug -f net8.0 -p:TestNetStandard=true --verbosity normal

      - name: Verify standalone single-algorithm copyability (.NET 8 & netstandard2.0)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path ([System.IO.Path]::GetTempPath()) "softwx-copytest-$([guid]::NewGuid().ToString('N'))"
          try {
            foreach ($algo in @('Levenshtein', 'DamerauOSA')) {
              $dir = Join-Path $root $algo
              New-Item -ItemType Directory -Path $dir -Force | Out-Null
              Copy-Item "SoftWx.Match/$algo.cs", "SoftWx.Match/Helpers.cs" $dir
              $srcPath = Join-Path $dir "$algo.cs"
              (Get-Content $srcPath -Raw).Replace(' : IDistance, ISimilarity', '') | Set-Content $srcPath -NoNewline
              @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <Nullable>enable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
          </Project>
          '@ | Set-Content (Join-Path $dir 'copytest.csproj')
              if ($algo -eq 'Levenshtein') {
                @'
          using System;
          using SoftWx.Match;
          var ed = new Levenshtein();
          if (ed.Distance("kitten", "sitting") != 3
              || Distance.Levenshtein("kitten", "sitting") != 3
              || "kitten".AsSpan().Levenshtein("sitting".AsSpan()) != 3
              || Math.Abs(Similarity.Levenshtein("flintstone", "hanson") - 0.4) > 1e-12) {
              throw new InvalidOperationException("Levenshtein standalone copy check failed.");
          }
          Console.WriteLine("Levenshtein standalone copy check passed.");
          '@ | Set-Content (Join-Path $dir 'Program.cs')
              } else {
                @'
          using System;
          using SoftWx.Match;
          var ed = new DamerauOSA();
          if (ed.Distance("ca", "ac") != 1
              || Distance.DamerauOSA("ca", "ac") != 1
              || "ca".AsSpan().DamerauOSA("ac".AsSpan()) != 1
              || Math.Abs(Similarity.DamerauOSA("flintstone", "flintsotne") - 0.9) > 1e-12) {
              throw new InvalidOperationException("DamerauOSA standalone copy check failed.");
          }
          Console.WriteLine("DamerauOSA standalone copy check passed.");
          '@ | Set-Content (Join-Path $dir 'Program.cs')
              }
              dotnet run --project (Join-Path $dir 'copytest.csproj') -c Release
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

              $nsDir = Join-Path $root "$algo-ns20"
              New-Item -ItemType Directory -Path $nsDir -Force | Out-Null
              Copy-Item $srcPath, "SoftWx.Match/Helpers.cs", "SoftWx.Match/SpanShim.cs" $nsDir
              @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <LangVersion>latest</LangVersion>
              <Nullable>enable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
          </Project>
          '@ | Set-Content (Join-Path $nsDir 'copytest-ns20.csproj')
              dotnet build (Join-Path $nsDir 'copytest-ns20.csproj') -c Release
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally {
            Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          }

      - name: Install NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish NativeAOT smoke test
        run: dotnet publish SoftWx.Match.AotTest/SoftWx.Match.AotTest.csproj --configuration Release --output ./SoftWx.Match.AotTest/bin/aot-publish

      - name: Run NativeAOT smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./SoftWx.Match.AotTest/bin/aot-publish/SoftWx.Match.AotTest

      - name: Run NativeAOT smoke test (Windows)
        if: runner.os == 'Windows'
        run: .\SoftWx.Match.AotTest\bin\aot-publish\SoftWx.Match.AotTest.exe

      - name: Pack
        run: dotnet pack SoftWx.Match/SoftWx.Match.csproj --configuration Release --no-build --output ./artifacts

